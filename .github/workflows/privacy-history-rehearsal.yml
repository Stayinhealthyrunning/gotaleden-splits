name: Read-only sensitive history sanitation rehearsal
on:
  push:
    branches: [main]
    paths:
      - 'privacy/sensitive-history-paths.txt'
      - '.github/workflows/privacy-history-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Git history filtering tool
        run: python -m pip install --disable-pip-version-check 'git-filter-repo==2.47.0'
      - name: Make disposable mirror and count references
        env:
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror --quiet "https://github.com/${REPO}.git" "$RUNNER_TEMP/privacy-mirror.git"
          git -C "$RUNNER_TEMP/privacy-mirror.git" for-each-ref --format='%(refname) %(objectname)' > "$RUNNER_TEMP/refs-before.txt"
          git -C "$RUNNER_TEMP/privacy-mirror.git" rev-parse refs/heads/main > "$RUNNER_TEMP/main-before.txt"
          echo "Mirror created; no push credentials and no writes to GitHub."
      - name: Rehearse complete path removal in DISPOSABLE mirror only
        shell: bash
        run: |
          set -euo pipefail
          if ! git -C "$RUNNER_TEMP/privacy-mirror.git" filter-repo --force --invert-paths --paths-from-file "$GITHUB_WORKSPACE/privacy/sensitive-history-paths.txt" >"$RUNNER_TEMP/filter-output.log" 2>&1; then
            echo "Local filter rehearsal failed; sanitized refs NOT applied."
            exit 1
          fi
          git -C "$RUNNER_TEMP/privacy-mirror.git" for-each-ref --format='%(refname) %(objectname)' > "$RUNNER_TEMP/refs-after.txt"
          git -C "$RUNNER_TEMP/privacy-mirror.git" rev-parse refs/heads/main > "$RUNNER_TEMP/main-after.txt"
      - name: Verify original paths absent from all rewritten branch/tag trees
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          mirror=Path(os.environ["RUNNER_TEMP"])/"privacy-mirror.git"
          paths=(Path(os.environ["GITHUB_WORKSPACE"])/"privacy/sensitive-history-paths.txt").read_text().splitlines()
          def cmd(*args):
              return subprocess.check_output(["git","-C",str(mirror),*args],text=True)
          refs=[s for s in cmd("for-each-ref","--format=%(refname)").splitlines() if s.startswith(("refs/heads/","refs/tags/"))]
          failed=0
          for ref in refs:
              files=cmd("ls-tree","-r","--name-only",ref).splitlines()
              if any(f==p or (p.endswith("/") and f.startswith(p)) for p in paths for f in files):
                  failed+=1
          before={line.split()[0]:line.split()[1] for line in (Path(os.environ["RUNNER_TEMP"])/"refs-before.txt").read_text().splitlines()}
          after={line.split()[0]:line.split()[1] for line in (Path(os.environ["RUNNER_TEMP"])/"refs-after.txt").read_text().splitlines()}
          changed=sum(before.get(k)!=after.get(k) for k in before.keys()|after.keys())
          summary=f"""## Local-only history sanitation rehearsal
          - Original tracked source paths selected: {len(paths)}
          - Branch and tag refs checked: {len(refs)}
          - Git refs changed in disposable clone: {changed}
          - Selected source paths still found in rewritten branch/tag tips: {failed}
          - No push or force push was performed. No repository refs were changed.
          - GitHub pull-request caches, forks, external clones, branch protection, and stale server objects are NOT addressed by this rehearsal.
          """
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:out.write(summary)
          if failed or not refs:raise SystemExit("History rehearsal failed closure test.")
          PY
