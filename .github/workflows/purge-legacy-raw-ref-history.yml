name: Rewrite legacy source-bearing branch and tag histories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-legacy-raw-ref-history.yml'
permissions:
  contents: write
concurrency:
  group: privacy-legacy-ref-sanitization
  cancel-in-progress: false
jobs:
  rewrite-legacy-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested Git history filter
        run: python -m pip install --disable-pip-version-check 'git-filter-repo==2.47.0'
      - name: Sanitize disposable complete mirror
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror --quiet "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/full-mirror.git"
          git -C "$RUNNER_TEMP/full-mirror.git" filter-repo --force --invert-paths \
            --paths-from-file "$GITHUB_WORKSPACE/privacy/sensitive-history-paths.txt" \
            >"$RUNNER_TEMP/local-rewrite.log" 2>&1
          git fetch --quiet --no-tags "$RUNNER_TEMP/full-mirror.git" '+refs/heads/*:refs/remotes/clean/*'
          git fetch --quiet --no-tags "$RUNNER_TEMP/full-mirror.git" '+refs/tags/*:refs/clean-tags/*' || true
          echo "Source-free rewritten Git objects available in isolated checkout."
      - name: Push rewritten legacy BRANCH refs with independent lease checks
        shell: bash
        run: |
          set -euo pipefail
          changed=0; same=0; failed=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/clean/}"
            if [ "$branch" = main ]; then continue; fi
            clean="$(git rev-parse "$ref")"
            previous="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$previous" ]; then continue; fi
            if [ "$clean" = "$previous" ]; then same=$((same+1)); continue; fi
            if git push --quiet --force-with-lease="refs/heads/$branch:$previous" \
                 origin "$clean:refs/heads/$branch" >"$RUNNER_TEMP/push-branch.log" 2>&1; then
              changed=$((changed+1))
            else
              failed=$((failed+1))
              echo "Failed to rewrite one protected/stale branch; no unsafe retry."
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/clean/)
          echo "Legacy branch rewrites: updated=$changed unchanged=$same blocked=$failed"
          echo "Branch update result: $changed updated, $same unchanged, $failed blocked" >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
      - name: Rewrite historical TAG refs with lease checks
        shell: bash
        run: |
          set -euo pipefail
          changed=0; same=0; failed=0
          while IFS= read -r ref; do
            tag="${ref#refs/clean-tags/}"
            clean="$(git rev-parse "$ref")"
            previous="$(git ls-remote --refs --tags origin "refs/tags/$tag" | awk '{print $1}')"
            if [ -z "$previous" ]; then continue; fi
            if [ "$clean" = "$previous" ]; then same=$((same+1)); continue; fi
            if git push --quiet --force-with-lease="refs/tags/$tag:$previous" \
                 origin "$clean:refs/tags/$tag" >"$RUNNER_TEMP/push-tag.log" 2>&1; then
              changed=$((changed+1))
            else
              failed=$((failed+1))
              echo "Failed to rewrite one protected/stale tag; no unsafe retry."
            fi
          done < <(git for-each-ref --format='%(refname)' refs/clean-tags/)
          echo "Legacy tag rewrites: updated=$changed unchanged=$same blocked=$failed"
          echo "Tag update result: $changed updated, $same unchanged, $failed blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "WARNING: Hidden pull-request references and external copies are outside this operation." >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
