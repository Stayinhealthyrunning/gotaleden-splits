name: Prepare source-sanitized main candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-sanitized-main.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install git-filter-repo
        run: python -m pip install --disable-pip-version-check 'git-filter-repo==2.47.0'
      - name: Rewrite in disposable mirror, then stage CLEAN branch only
        shell: bash
        env:
          CANDIDATE: privacy/sanitized-main-review-2026-10-14
        run: |
          set -euo pipefail
          git clone --mirror --quiet "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/privacy-mirror.git"
          git -C "$RUNNER_TEMP/privacy-mirror.git" filter-repo \
            --force --invert-paths \
            --paths-from-file "$GITHUB_WORKSPACE/privacy/sensitive-history-paths.txt" \
            >"$RUNNER_TEMP/local-filter.log" 2>&1
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          mirror=Path(os.environ["RUNNER_TEMP"])/"privacy-mirror.git"
          protected=(Path(os.environ["GITHUB_WORKSPACE"])/"privacy/sensitive-history-paths.txt").read_text().splitlines()
          def git(*args):
              return subprocess.check_output(["git","-C",str(mirror),*args],text=True)
          files=git("ls-tree","-r","--name-only","refs/heads/main").splitlines()
          blocked=sum(1 for p in protected for f in files if f==p or (p.endswith("/") and f.startswith(p)))
          if blocked:raise SystemExit("Sanitized candidate still contains protected raw paths.")
          sha=git("rev-parse","refs/heads/main").strip()
          print("Sanitized candidate tree and commit verified; no protected paths.")
          Path(os.environ["RUNNER_TEMP"]).joinpath("candidate-head.txt").write_text(sha)
          PY
          sha="$(cat "$RUNNER_TEMP/candidate-head.txt")"
          git fetch --quiet "$RUNNER_TEMP/privacy-mirror.git" refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          git push origin "$sha:refs/heads/$CANDIDATE"
          echo "A new sanitized candidate branch has been uploaded. The existing main and all other remote refs remain UNCHANGED."
